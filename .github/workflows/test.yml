name: Monkey Frontier checks

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --ignore-scripts

      - name: Static syntax checks
        run: npm run syntax

      - name: Core regression tests
        run: npm test
