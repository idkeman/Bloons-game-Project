name: Skyfront Dominion CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/save.js
          node --check js/audio.js
          node --check js/engine.js
          node --check js/ui.js
          node --check tests/node-smoke.mjs
          node --check tests/browser-smoke.mjs

      - name: Run simulation smoke suite
        run: npm run test:smoke

      - name: Start static server
        run: python3 -m http.server 8080 --directory . > /tmp/skyfront-server.log 2>&1 &

      - name: Run Chromium smoke suite
        run: npm run test:browser
